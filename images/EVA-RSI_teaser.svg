<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">EVA-RSI: recursive self-improvement of video evaluators</title>
  <desc id="desc">A current video evaluator is improved by agents proposing changes, engineers training candidates, and a fixed exam and Nash rule selecting the next champion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5278f4"/>
      <stop offset="1" stop-color="#344fc4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c7a0"/>
      <stop offset="1" stop-color="#159879"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#29375c" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#8995b3"/>
    </marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5278f4"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #1e2945; font-size: 21px; font-weight: 700; }
      .sub { fill: #66718c; font-size: 15px; }
      .tiny { fill: #69748e; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
    </style>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="48" y="62" fill="#66718c" font-size="14" font-weight="700" letter-spacing=".14em">VIDEO EVALUATOR · RECURSIVE SELF-IMPROVEMENT</text>
  <text x="48" y="112" fill="#17213a" font-size="34" font-weight="800">EVA-RSI</text>
  <text x="48" y="142" fill="#66718c" font-size="17">Agents improve temporal judgment, round by round</text>

  <!-- flow connectors -->
  <path d="M190 285H254M400 285H460M606 285H666" fill="none" stroke="#aab4cc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M812 285H856" fill="none" stroke="#aab4cc" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- current evaluator -->
  <g filter="url(#shadow)">
    <rect x="42" y="218" width="148" height="134" rx="22" fill="#fff"/>
    <circle cx="116" cy="259" r="23" fill="#fff2d9"/>
    <path d="m106 249 22 10-22 10z" fill="#e89a16"/>
    <text class="label" x="116" y="307" text-anchor="middle">Current</text>
    <text class="sub" x="116" y="329" text-anchor="middle">video evaluator</text>
  </g>

  <!-- agents -->
  <g filter="url(#shadow)">
    <rect x="254" y="218" width="146" height="134" rx="22" fill="#fff"/>
    <circle cx="298" cy="257" r="15" fill="#d9f6ed"/><circle cx="327" cy="251" r="15" fill="#d9f6ed"/><circle cx="356" cy="257" r="15" fill="#d9f6ed"/>
    <path d="M279 282c0-12 9-19 19-19s19 7 19 19M308 277c0-12 9-19 19-19s19 7 19 19M337 282c0-12 9-19 19-19s19 7 19 19" fill="none" stroke="#159879" stroke-width="5" stroke-linecap="round"/>
    <text class="label" x="327" y="316" text-anchor="middle">9 Proposers</text>
    <text class="sub" x="327" y="338" text-anchor="middle">explore improvements</text>
  </g>

  <!-- build -->
  <g filter="url(#shadow)">
    <rect x="460" y="218" width="146" height="134" rx="22" fill="#fff"/>
    <circle cx="533" cy="259" r="25" fill="#eeeaff"/>
    <path d="m521 268 24-24m-17 1 16 16m-26-1 16 16" fill="none" stroke="#7358d7" stroke-width="5" stroke-linecap="round"/>
    <text class="label" x="533" y="316" text-anchor="middle">Build &amp; train</text>
    <text class="sub" x="533" y="338" text-anchor="middle">candidate models</text>
  </g>

  <!-- frozen verifier -->
  <g filter="url(#shadow)">
    <rect x="666" y="218" width="146" height="134" rx="22" fill="#fff"/>
    <circle cx="739" cy="259" r="25" fill="#e5ebff"/>
    <path d="m726 258 9 9 18-20" fill="none" stroke="#405bd0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="739" y="316" text-anchor="middle">Fixed exam</text>
    <text class="sub" x="739" y="338" text-anchor="middle">Nash rule selects</text>
  </g>

  <!-- champion -->
  <g filter="url(#shadow)">
    <rect x="856" y="232" width="74" height="106" rx="22" fill="url(#blue)"/>
    <path d="M878 262h30l-4 21h-22zM881 258l-4-13 13 7 4-12 5 12 13-7-4 13" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="893" y="309" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">NEXT</text>
    <text x="893" y="326" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">CHAMPION</text>
  </g>

  <!-- human-designed guardrails -->
  <rect x="666" y="169" width="146" height="30" rx="15" fill="#fff0e7"/>
  <circle cx="683" cy="184" r="7" fill="#e97a37"/>
  <text x="697" y="189" fill="#a84a1c" font-size="12" font-weight="700">HUMAN-DESIGNED EXAM + RULE</text>

  <!-- recursive loop -->
  <path d="M892 356v74H116v-67" fill="none" stroke="#5278f4" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round" marker-end="url(#loopArrow)"/>
  <rect x="350" y="412" width="292" height="38" rx="19" fill="#e4eaff"/>
  <text x="496" y="437" text-anchor="middle" fill="#344fc4" font-size="15" font-weight="700">Accepted champion starts the next round</text>

  <rect x="42" y="480" width="876" height="1" fill="#dce3f2"/>
  <text x="48" y="510" fill="#66718c" font-size="13">Human labels anchor the exam to real videos · fixed checks prevent regressions across dimensions</text>
</svg>
